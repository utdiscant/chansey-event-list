name: Deploy event checklist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /chansey-event-list
          NEXT_PUBLIC_SITE_URL: https://utdiscant.github.io/chansey-event-list/
        run: npm run build
      - name: Prepare Pages-safe assets
        env:
          NEXT_PUBLIC_BASE_PATH: /chansey-event-list
        run: node scripts/prepare-github-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
